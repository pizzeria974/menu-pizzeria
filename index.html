<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu - Pizzeria</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#111;
  font-family:Arial,sans-serif;
  color:white;
}

header{
  text-align:center;
  padding:18px 12px;
  background:#111;
}

h1{
  margin:0;
  font-size:28px;
}

.actions{
  display:flex;
  gap:12px;
  padding:0 14px 18px;
  max-width:700px;
  margin:auto;
}

.actions a{
  flex:1;
  text-decoration:none;
  text-align:center;
  padding:18px 10px;
  border-radius:14px;
  font-weight:bold;
  font-size:18px;
}

.menu{
  background:white;
  color:#111;
}

.call{
  background:#1bb94b;
  color:white;
}

.viewer{
  background:white;
  max-width:1000px;
  margin:auto;
  padding:10px;
}

canvas{
  display:block;
  width:100%;
  height:auto;
  margin:0 auto 12px;
}

.note{
  text-align:center;
  color:#bbb;
  font-size:12px;
  padding:12px;
}
</style>
</head>

<body>

<header>
  <h1>🍕 MENU</h1>
</header>

<div class="actions">
  <a class="menu" href="#menu">Voir le menu</a>
  <a class="call" href="tel:+262692050580">📞 Appeler</a>
</div>

<div id="menu" class="viewer">
  <div id="pdf-container"></div>
</div>

<div class="note">
  Faites glisser pour parcourir le menu et utilisez deux doigts pour zoomer.
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const url = "menu.pdf";
const container = document.getElementById("pdf-container");

pdfjsLib.getDocument(url).promise.then(function(pdf){

  for(let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++){

    pdf.getPage(pageNumber).then(function(page){

      const viewport = page.getViewport({scale:2});
      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d");

      canvas.width = viewport.width;
      canvas.height = viewport.height;

      container.appendChild(canvas);

      page.render({
        canvasContext: context,
        viewport: viewport
      });
    });

  }

}).catch(function(error){

  container.innerHTML =
    "<p style='color:#111;text-align:center;padding:30px'>Impossible d'afficher le menu.</p>";

});
</script>

</body>
</html>
