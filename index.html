<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu - Pizzeria</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  font-family: Arial, sans-serif;
  color: white;
}

header {
  text-align: center;
  padding: 22px 14px 16px;
  background: #111;
}

h1 {
  margin: 0;
  font-size: 30px;
}

.actions {
  display: flex;
  gap: 12px;
  padding: 14px 18px 18px;
  max-width: 700px;
  margin: auto;
}

.actions a {
  flex: 1;
  text-decoration: none;
  text-align: center;
  padding: 18px 10px;
  border-radius: 14px;
  font-weight: bold;
  font-size: 18px;
}

.menu-button {
  background: white;
  color: #111;
}

.call-button {
  background: #18c44f;
  color: white;
}

.viewer {
  background: white;
  width: 100%;
  max-width: 1000px;
  margin: auto;
  overflow-x: auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.viewer img {
  display: block;
  width: 100%;
  height: auto;
  max-width: none;
}

.note {
  text-align: center;
  color: #bbb;
  font-size: 13px;
  padding: 12px;
}
</style>
</head>

<body>

<header>
  <h1>🍕 MENU</h1>

  <div class="actions">
    <a class="menu-button" href="#menu">Voir le menu</a>
    <a class="call-button" href="tel:+262692050580">📞 Appeler</a>
  </div>
</header>

<div class="viewer" id="menu">
  <img src="menu.webp" alt="Menu de la pizzeria">
</div>

<div class="note">
  Faites glisser pour parcourir le menu et utilisez deux doigts pour zoomer.
</div>

</body>
</html>
